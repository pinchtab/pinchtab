name: CI / E2E
permissions: {contents: read}
on:
  pull_request:
    branches: [main]
    paths-ignore: &docs-only ['**.md', 'docs/**', 'LICENSE', '.gitignore', 'skills/**']
  push:
    branches: [main]
    paths-ignore: *docs-only
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        default: all
        type: choice
        options: [all, api, cli, infra, smoke]

jobs:
  detect-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      basic_suites: ${{ steps.changes.outputs.basic_suites }}
      extended_suites: ${{ steps.changes.outputs.extended_suites }}
      run_smoke: ${{ steps.changes.outputs.run_smoke }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Decide which suites this run needs
        id: changes
        shell: bash
        env:
          E2E_EVENT: ${{ github.event_name }}
          E2E_DISPATCH_SUITE: ${{ inputs.suite }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          case "$E2E_EVENT" in
            pull_request) git diff --name-only origin/main...HEAD ;;
            push) git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" ;;
          esac | ./scripts/ci/detect-e2e-suites.sh >> "$GITHUB_OUTPUT"

  basic:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.basic_suites != '[]'
    strategy:
      fail-fast: false
      matrix: {suite: "${{ fromJSON(needs.detect-changes.outputs.basic_suites) }}"}
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: ${{ matrix.suite }}
      summary_title: E2E ${{ matrix.suite }} Tests
      timeout_minutes: 15

  extended:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.extended_suites != '[]'
    strategy:
      fail-fast: false
      matrix: {suite: "${{ fromJSON(needs.detect-changes.outputs.extended_suites) }}"}
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: ${{ matrix.suite }}
      summary_title: E2E ${{ matrix.suite }} Tests
      timeout_minutes: ${{ matrix.suite == 'infra-extended' && 25 || 20 }}

  smoke:
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.run_smoke == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'smoke'))
    uses: ./.github/workflows/reusable-smoke.yml
    with:
      ref: ${{ github.sha }}
