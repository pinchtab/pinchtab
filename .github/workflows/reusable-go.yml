name: Reusable / Go

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      windows_tests:
        required: false
        type: boolean
        default: false


permissions:
  contents: read

jobs:
  windows-test:
    name: Test (windows)
    if: inputs.windows_tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download deps
        run: go mod download

      - name: Format check
        run: |
          mapfile -t go_files < <(git ls-files -- '*.go' | while read -r file; do
            [ -f "$file" ] && printf '%s\n' "$file"
          done)
          unformatted=""
          if [ ${#go_files[@]} -gt 0 ]; then
            unformatted=$(gofmt -l "${go_files[@]}")
          fi
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o pinchtab ./cmd/pinchtab

      - name: Deadcode report
        continue-on-error: true
        run: |
          go run golang.org/x/tools/cmd/deadcode@v0.50.0 ./cmd/... | tee deadcode.log
          {
            echo "### Unreachable funcs ($(wc -l < deadcode.log))"
            echo '```'
            cat deadcode.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Agent preamble budget
        run: |
          set +e
          go test -count=1 -v -run TestAgentPreambleStaysWithinBudget ./internal/mcp/ 2>&1 | tee preamble.log
          status=${PIPESTATUS[0]}
          if ! grep -q '^=== RUN' preamble.log; then
            echo "no test ran: -run matched nothing, so the preamble budget guard is vacuous; re-point it at whatever measures the preamble rather than deleting it" >&2
            status=1
          fi
          {
            echo "### Agent preamble"
            echo '```'
            cat preamble.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # No --hide-summary. The output section carries file:line and expected-vs-actual
      # under each failing test name, plus the reason under each skip, and in CI the log
      # is the only artifact. skipped is not hidden either: scripts/test.sh hides it only
      # because print_skipped_tests re-renders that list with each reason attached, and CI
      # has no equivalent. TestNoGotestsumInvocationHidesTheOutputSummary enforces the
      # output half repo-wide.
      - name: Test with coverage
        run: go tool -modfile=tools/go.mod gotestsum --format=pkgname -- -p 1 -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1)
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain
        with:
          install-dashboard-deps: "false"

      - name: Build dashboard
        run: ./scripts/build-dashboard.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  security:
    # gosec loads packages through go/packages, which honours build constraints, so a
    # single linux run never parses a //go:build windows or //go:build darwin file. The
    # only two G204 sites in this repo live in internal/bridge/cleanup_windows.go, which
    # means the rule this job fails on could not see the code that trips it. Scan every
    # GOOS this project releases binaries for.
    name: Security Scan (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run gosec
        env:
          GOOS: ${{ matrix.goos }}
        run: ./scripts/check-gosec.sh
